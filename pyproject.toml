[project]
name = "realtime-transcription-demo"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "websockets>=14.0",
    "whisper-live>=0.7.0; platform_system == 'Darwin'",
]

# openai-whisper (transitive dep) needs pkg_resources at build time; setuptools 82+ removed it, so pin <82
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools>=70.0.0,<82"]

[dependency-groups]
dev = [
    "ty>=0.0.12",
]

[tool.apx.metadata]
app-name = "realtime-transcription-demo"
app-slug = "realtime_transcription_demo"
app-entrypoint = "realtime_transcription_demo.backend.app:app"
api-prefix = "/api"
metadata-path = "src/realtime_transcription_demo/_metadata.py"

[tool.apx.ui]
root = "src/realtime_transcription_demo/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/realtime_transcription_demo/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/realtime_transcription_demo/__dist__", "src/realtime_transcription_demo/_metadata.py"]
exclude = ["src/realtime_transcription_demo/ui"]
